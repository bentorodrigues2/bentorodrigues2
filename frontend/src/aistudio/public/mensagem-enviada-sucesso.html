<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mensagem Enviada com Sucesso</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .msg-icon {
      width: 56px;
      height: 56px;
      background: #0ea5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: 12px;
    }
    .msg-icon svg {
      width: 30px;
      height: 30px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .status-title {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
    }
    .status-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="msg-icon">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div class="status-title">Mensagem Enviada com Sucesso!</div>
  <div class="status-sub">A notificação foi entregue ao condómino/destinatário.</div>
</body>
</html>
