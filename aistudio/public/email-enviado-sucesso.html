<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>E-mail Enviado com Sucesso</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .check-icon {
      width: 56px;
      height: 56px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: 12px;
    }
    .check-icon svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .status-title {
      font-size: 15px;
      font-weight: 800;
      color: #34d399;
    }
    .status-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="check-icon">
    <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <div class="status-title">E-mail Enviado com Sucesso!</div>
  <div class="status-sub">O destinatário receberá a mensagem em instantes.</div>
</body>
</html>
