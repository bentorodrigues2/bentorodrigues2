<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>A enviar</title>
<style>
  :root {
    --navy-deep: #0a1220;
    --navy-light: #16273f;
    --green: #17c37b;
    --green-dim: rgba(23,195,123,.18);
    --text-main: #f4f7fa;
    --text-dim: #9fb0c3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, var(--navy-light), var(--navy-deep) 70%);
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.85);
    animation: fade-in 0.45s ease-out forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; transform: scale(1); }
  }

  .logo-img {
    width: 132px;
    height: 132px;
    border-radius: 30px;
    box-shadow: 0 12px 32px rgba(0,0,0,.55);
    position: relative;
    z-index: 2;
    animation: breathe 1.6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }

  /* trilho de fundo (fixo, ténue) */
  .track {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .track circle {
    fill: none;
    stroke: var(--green-dim);
    stroke-width: 4;
  }

  /* arco verde que roda continuamente */
  .spinner {
    position: absolute;
    inset: 0;
    z-index: 1;
    animation: spin 1.15s linear infinite;
    transform-origin: 50% 50%;
  }
  .spinner circle {
    fill: none;
    stroke: var(--green);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 90 400;
    filter: drop-shadow(0 0 6px rgba(23,195,123,.85));
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .title {
    margin-top: 26px;
    color: var(--text-main);
    font-size: 18px;
    font-weight: 600;
    text-align: center;
  }

  .dots span {
    display: inline-block;
    animation: blink 1.3s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: .15; }
    40% { opacity: 1; }
  }

  .subtitle {
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
