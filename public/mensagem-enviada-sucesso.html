<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Mensagem enviada com sucesso</title>
<style>
  :root {
    --navy-deep: #0a1220;
    --navy: #101d33;
    --navy-light: #16273f;
    --green: #17c37b;
    --text-main: #f4f7fa;
    --text-dim: #9fb0c3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, var(--navy-light), var(--navy-deep) 70%);
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 40px;
  }

  /* --- logo entra a rodar --- */
  .logo-wrap {
    position: relative;
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.3) rotate(-260deg);
    animation: spin-in 0.85s cubic-bezier(.2,.9,.3,1.1) 0.15s forwards;
  }

  @keyframes spin-in {
    0%   { opacity: 0; transform: scale(0.3) rotate(-260deg); }
    65%  { opacity: 1; transform: scale(1.1) rotate(14deg); }
    85%  { transform: scale(0.96) rotate(-6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .logo-img {
    width: 132px;
    height: 132px;
    border-radius: 30px;
    box-shadow: 0 12px 32px rgba(0,0,0,.55);
    position: relative;
    z-index: 2;
  }

  .halo {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .halo circle {
    fill: none;
    stroke: var(--green);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 480;
    stroke-dashoffset: 480;
    transform-origin: 50% 50%;
    transform: rotate(-90deg);
    animation: draw-ring 0.9s ease-out 0.75s forwards;
    filter: drop-shadow(0 0 6px rgba(23,195,123,.65));
  }

  @keyframes draw-ring {
    to { stroke-dashoffset: 0; }
  }

  /* --- badge (envelope / mensagem) --- */
  .badge {
    position: absolute;
    right: -6px;
    bottom: 4px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--navy);
    border: 3px solid var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    opacity: 0;
    transform: scale(0.3) translateY(6px);
    animation: badge-in 0.45s cubic-bezier(.2,1.5,.4,1) 1.25s forwards;
    box-shadow: 0 6px 16px rgba(0,0,0,.5);
  }

  @keyframes badge-in {
    0%   { opacity: 0; transform: scale(0.3) translateY(6px); }
    70%  { opacity: 1; transform: scale(1.15) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .badge svg { width: 26px; height: 26px; }
  .badge .icon-stroke {
    fill: none;
    stroke: var(--green);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 140;
    stroke-dashoffset: 140;
    animation: draw-icon 0.5s ease-out 1.45s forwards;
  }
  @keyframes draw-icon { to { stroke-dashoffset: 0; } }

  .badge .check-mark {
    fill: none;
    stroke: var(--green);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    opacity: 0;
    animation: draw-check 0.35s ease-out 1.9s forwards;
  }
  @keyframes draw-check {
    0%   { opacity: 0; }
    1%   { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }

  /* --- texto --- */
  .title {
    margin-top: 28px;
    color: var(--text-main);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .2px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: rise-in 0.5s ease-out 1.35s forwards;
  }

  .subtitle {
    margin-top: 6px;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: rise-in 0.5s ease-out 1.55s forwards;
  }

  @keyframes rise-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- particulas --- */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--green);
    opacity: 0;
    animation: float-out 1.1s ease-out 1.35s forwards;
  }
  @keyframes float-out {
    0%   { opacity: 0; transform: translate(0,0) scale(0.4); }
    15%  { opacity: .9; }
    100% { opacity: 0; transform: var(--pt) scale(1); }
  }
</style>
</head>
